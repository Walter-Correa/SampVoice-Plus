<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 202 386" width="202" height="386" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="202" y2="386" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E131C"/>
      <stop offset="52%" stop-color="#182130"/>
      <stop offset="100%" stop-color="#10151F"/>
    </linearGradient>
    <radialGradient id="haloGrad" cx="101" cy="162" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE08A" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#D4F06A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#182130" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brandGrad" x1="101" y1="90" x2="101" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="55%" stop-color="#E7E978"/>
      <stop offset="100%" stop-color="#D4F06A"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="202" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="100%" stop-color="#D4F06A"/>
    </linearGradient>
    <linearGradient id="subtleArc" x1="101" y1="70" x2="101" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE08A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#D4F06A" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- Base obsidian panel -->
  <rect x="0" y="0" width="202" height="386" fill="url(#bgGrad)"/>

  <!-- Top subtle ambient highlight strip -->
  <rect x="0" y="0" width="202" height="3" fill="url(#barGrad)" opacity="0.85"/>

  <!-- Soft acoustic glow behind hero -->
  <circle cx="101" cy="162" r="110" fill="url(#haloGrad)"/>

  <!-- Concentric signal rings -->
  <circle cx="101" cy="162" r="46" stroke="url(#subtleArc)" stroke-width="1" opacity="0.40"/>
  <circle cx="101" cy="162" r="68" stroke="url(#subtleArc)" stroke-width="1" stroke-dasharray="6 5" opacity="0.28"/>
  <circle cx="101" cy="162" r="90" stroke="#D4F06A" stroke-width="0.9" opacity="0.14"/>

  <!-- Top header miniature equalizer emblem -->
  <rect x="88" y="34" width="6" height="14" rx="3" fill="#ECE87A" opacity="0.92"/>
  <rect x="98" y="27" width="6" height="24" rx="3" fill="#FFE08A"/>
  <rect x="108" y="31" width="6" height="18" rx="3" fill="#D4F06A" opacity="0.95"/>

  <!-- Outer symmetrical acoustic wave arcs -->
  <path d="M51 124 C39 144 39 172 51 192" stroke="#FFE08A" stroke-width="3.2" stroke-linecap="round" opacity="0.55"/>
  <path d="M38 112 C22 140 22 176 38 204" stroke="#D4F06A" stroke-width="2.4" stroke-linecap="round" opacity="0.28"/>
  <path d="M151 124 C163 144 163 172 151 192" stroke="#FFE08A" stroke-width="3.2" stroke-linecap="round" opacity="0.55"/>
  <path d="M164 112 C180 140 180 176 164 204" stroke="#D4F06A" stroke-width="2.4" stroke-linecap="round" opacity="0.28"/>

  <!-- Studio Microphone Capsule -->
  <rect x="81" y="102" width="40" height="68" rx="20" fill="url(#brandGrad)"/>
  <!-- Subtle grille slits -->
  <rect x="89" y="118" width="24" height="3.2" rx="1.6" fill="#182130" opacity="0.45"/>
  <rect x="89" y="127" width="24" height="3.2" rx="1.6" fill="#182130" opacity="0.45"/>
  <rect x="89" y="136" width="24" height="3.2" rx="1.6" fill="#182130" opacity="0.45"/>

  <!-- Cradle U-Arc, Stem & Base -->
  <path d="M68 148 A33 33 0 0 0 134 148" stroke="url(#brandGrad)" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="101" y1="181" x2="101" y2="210" stroke="url(#brandGrad)" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M77 210 H125" stroke="url(#brandGrad)" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Decorative Plus Badge & Acoustic Motif at Lower Section -->
  <rect x="52" y="268" width="98" height="28" rx="14" fill="#1E2839" stroke="#303E55" stroke-width="1.2"/>
  <rect x="65" y="279" width="20" height="6" rx="3" fill="#FFE08A" opacity="0.45"/>
  <rect x="117" y="279" width="20" height="6" rx="3" fill="#D4F06A" opacity="0.45"/>
  <circle cx="101" cy="282" r="10.5" fill="#D4F06A"/>
  <path d="M96.5 282 H105.5 M101 277.5 V286.5" stroke="#141922" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Subtle lower equalizer waveform dots/bars -->
  <rect x="67" y="322" width="4" height="10" rx="2" fill="#FFE08A" opacity="0.22"/>
  <rect x="75" y="317" width="4" height="20" rx="2" fill="#FFE08A" opacity="0.34"/>
  <rect x="83" y="320" width="4" height="14" rx="2" fill="#ECE87A" opacity="0.42"/>
  <rect x="91" y="314" width="4" height="26" rx="2" fill="#FFE08A" opacity="0.52"/>
  <rect x="99" y="311" width="4" height="32" rx="2" fill="#E7E978" opacity="0.62"/>
  <rect x="107" y="315" width="4" height="24" rx="2" fill="#D4F06A" opacity="0.52"/>
  <rect x="115" y="319" width="4" height="16" rx="2" fill="#D4F06A" opacity="0.40"/>
  <rect x="123" y="317" width="4" height="20" rx="2" fill="#D4F06A" opacity="0.32"/>
  <rect x="131" y="322" width="4" height="10" rx="2" fill="#D4F06A" opacity="0.22"/>

  <!-- Bottom crisp brand accent line -->
  <rect x="0" y="381" width="202" height="5" fill="url(#barGrad)"/>
</svg>
